<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8e4d8">
  <meta name="description" content="Sort colorful coins, merge matching stacks, and explore 100 color-sorting challenges in Coin Merge.">
  <title>Coin Merge</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e8e4d8; }
    body { display: flex; justify-content: center; font: 16px system-ui, sans-serif; color: #394b4d; }
    #game { position: relative; width: min(100%, 56.22vh, 562px); height: 100%; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding: 24px; background: #e8e4d8; text-align: center; }
    #status img { width: min(80%, 300px); height: auto; }
    #status h1 { margin: 0; font-size: 32px; }
    #status progress { width: min(80%, 260px); accent-color: #668b80; }
    #notice { white-space: pre-line; line-height: 1.5; }
    button { padding: 10px 24px; border: 0; border-radius: 12px; background: #668b80; color: white; font: inherit; cursor: pointer; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main id="game">
    <canvas id="canvas" tabindex="0" aria-label="Coin Merge game">Your browser does not support canvas.</canvas>
    <div id="status" role="status" aria-live="polite">
      <h1>Coin Merge</h1>
      <progress id="progress" aria-label="Loading game"></progress>
      <span id="notice">Loading your coins…</span>
      <button id="retry" hidden>Try again</button>
      <noscript>Enable JavaScript to play Coin Merge.</noscript>
    </div>
  </main>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    // The game's own saved preference/YouTube detection selects the language.
    // An explicit initial locale also handles browsers reporting an empty locale.
    const engine = new Engine({ ...GODOT_CONFIG, locale: 'en_US' });
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const notice = document.getElementById('notice');
    const retry = document.getElementById('retry');

    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(bounds.width * ratio);
      canvas.height = Math.round(bounds.height * ratio);
    }
    resizeCanvas();
    new ResizeObserver(resizeCanvas).observe(document.getElementById('game'));
    retry.addEventListener('click', () => window.location.reload());

    function showError(error) {
      console.error(error);
      progress.hidden = true;
      notice.textContent = 'The game could not start. Please try again in an up-to-date browser.\n' + (error.message || String(error));
      retry.hidden = false;
    }

    const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
    if (missing.length) {
      showError(new Error('Missing browser features: ' + missing.join(', ')));
    } else {
      engine.startGame({
        canvas,
        onProgress(current, total) {
          if (total > 0) { progress.max = total; progress.value = current; }
          else { progress.removeAttribute('value'); }
        },
      }).then(() => {
        document.title = 'Coin Merge';
        status.remove();
        canvas.focus({ preventScroll: true });
      }).catch(showError);
    }
  </script>
</body>
</html>
